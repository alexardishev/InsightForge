env: "local"
log_lang: "ru"
storage_path: "postgresql://postgres:password@postgres:5432/postgres?sslmode=disable"
dwh_db: "postgres"
dwh_db_path: "postgresql://postgres:password@postgres:5432/postgres_copy?sslmode=disable"
oltp_db: "postgres"
oltp_connections:
  - name: postgres_oltp
    connection_string: "postgresql://postgres:password@postgres:5432/postgres_oltp?sslmode=disable"
    connection_string_kafka: "postgresql://postgres:password@postgres:5432/postgres_oltp?sslmode=disable"
    # heartbeat_table: public.insightforge_heartbeat  # для «тихой» базы-источника, см. docs/CDC_OPERATIONS.md
  - name: postgres_oltp_2
    connection_string: "postgresql://postgres:password@postgres:5432/postgres_oltp_2?sslmode=disable"
    connection_string_kafka: "postgresql://postgres:password@postgres:5432/postgres_oltp_2?sslmode=disable"
smtp_setting:
    host: "smtp.example.com"
    port: 587
    username: "user@example.com"
    password: "password"
    admin_email: "admin@example.com"
    from_email: "noreply@example.com"
token_ttl: 1h
topic_subscription_interval: 5s
# Наблюдатель за слотами репликации источников (WAL); disabled: true — выключить.
wal_watch:
    interval: 1m
    retained_warn_mb: 5120
kafka:
    bootstrap.servers: "kafka:9092"
    acks: "all"
    client_id: "debeziumConsumer"
    enable.auto.commit: "false"
    auto.offset.reset: "earliest"
    session.timeout.ms: "6000"
    group.id: "cdc-consumer-group"
    # Сколько хранить сообщения в DLQ (<topic>.dlq): 0 — по умолчанию брокера, -1s — бессрочно.
    dlq_retention: 720h
    # Сколько хранить события Debezium: если CDC отстанет больше, события удалятся непрочитанными.
    # 0 — по умолчанию брокера, -1s — бессрочно.
    debezium_topic_retention: 336h
kafka_connect: "http://kafka-connect:8083"
grpc:
  port: 13890
  timeout: 11h
